<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxinexo | Entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div id="taxCarousel" class="tax-carousel hidden" aria-label="Destaques"></div>
  <main class="auth-shell">
    <header class="auth-brand"><img src="login-header.webp" alt="Taxinexo Investimento"></header>
    <section class="auth-card">
      <h1><span class="user-icon" aria-hidden="true">♙</span>Entrar</h1>
      <form id="loginForm" onsubmit="event.preventDefault(); fazerLogin()">
        <label class="input-wrap"><span aria-hidden="true">✉</span><input type="email" id="email" autocomplete="email" placeholder="Seu e-mail" aria-label="Seu e-mail" required></label>
        <div class="input-wrap"><span aria-hidden="true">♙</span><input type="password" id="senha" autocomplete="current-password" placeholder="Sua senha" aria-label="Sua senha" required><button type="button" class="password-toggle" aria-label="Mostrar senha" aria-pressed="false" onclick="alternarSenha(this,'senha')">◉</button></div>
        <button class="primary" type="submit">Entrar<span aria-hidden="true">→</span></button>
      </form>
      <p class="link">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      <p class="link" style="margin-top:8px;font-size:12px;"><a href="admin.html">Acesso administrativo</a></p>
    </section>
    <footer class="auth-footer" role="img" aria-label="Seu futuro começa agora"></footer>
  </main>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="pagamentos.js"></script>
  <script src="script.js"></script>
  <script src="carrossel.js"></script>

  <span aria-hidden="true">💬</span> Grupo
</a>
</body>
</html>
